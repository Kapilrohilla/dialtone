# AI calling stack: Redis + LiveKit server + LiveKit SIP (+ optional agent worker).
#
# All services use host networking: SIP/RTP and WebRTC need large UDP port
# ranges, which Docker's port mapping handles poorly. Requires a Linux host.
#
# Versions are pinned on purpose. Upgrade by bumping the tags in .env
# (LIVEKIT_VERSION / SIP_VERSION) and testing on staging first.

services:
  redis:
    image: redis:7.4-alpine
    network_mode: host
    restart: unless-stopped
    # Persist to disk: SIP trunks and dispatch rules live in Redis, so losing it
    # on a restart means every inbound call is rejected (486 no-dispatch).
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "${REDIS_PORT:-6380}",
              "--appendonly", "yes", "--appendfsync", "everysec", "--dir", "/data"]
    volumes:
      - redis-data:/data

  # Dashboard database. Localhost only, data in the postgres-data volume.
  postgres:
    image: postgres:16.4-alpine
    network_mode: host
    restart: unless-stopped
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-dashboard}"
      POSTGRES_USER: "${POSTGRES_USER:-dashboard}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?run scripts/init.sh}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:${LIVEKIT_VERSION:?set LIVEKIT_VERSION in .env}
    network_mode: host
    restart: unless-stopped
    depends_on: [redis]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?run scripts/init.sh}: ${LIVEKIT_API_SECRET:?run scripts/init.sh}"
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: ["0.0.0.0"]
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          use_external_ip: true
        redis:
          address: 127.0.0.1:${REDIS_PORT:-6380}
        prometheus:
          port: 6789
        # Call events -> dashboard (call history).
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://127.0.0.1:${DASHBOARD_PORT:-8787}/webhook
        logging:
          level: info
          json: true

  sip:
    image: livekit/sip:${SIP_VERSION:?set SIP_VERSION in .env}
    network_mode: host
    restart: unless-stopped
    depends_on: [redis, livekit]
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:${REDIS_PORT:-6380}
        sip_port: 5060
        rtp_port: 10000-20000
        use_external_ip: true
        prometheus_port: 6790
        logging:
          level: ${SIP_LOG_LEVEL:-info}

  # Calls dashboard. Listens on localhost only; open it via `make tunnel`.
  dashboard:
    build: ./dashboard
    image: ai-calling-dashboard:local
    network_mode: host
    restart: unless-stopped
    depends_on:
      livekit:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DASHBOARD_HOST: 127.0.0.1
    volumes:
      - dashboard-data:/data

  # Agent worker. Runs on the media VM in phase 1; in phase 2 run only this
  # service on separate agent VMs with LIVEKIT_URL pointing at the media VM:
  #   docker compose --profile agent up -d agent
  agent:
    profiles: ["agent"]
    build: ./agent
    image: ai-calling-agent:local
    network_mode: host
    restart: unless-stopped
    env_file: .env
    stop_grace_period: 5m  # let in-progress calls finish on deploy

  # Text simulator for the console's "Try it" and "Test call" (agent/simulate.py). Same image as the
  # agent; listens on 127.0.0.1:${SIM_PORT:-8790} and only accepts the dashboard's console-sim token.
  agent-sim:
    profiles: ["agent"]
    build: ./agent
    image: ai-calling-agent:local
    command: ["python", "simulate.py"]
    network_mode: host
    restart: unless-stopped
    env_file: .env

volumes:
  dashboard-data:
  postgres-data:
  redis-data:
