# Dialtone stack: Redis + PostgreSQL + LiveKit server + LiveKit SIP + egress + server (Django) + console
# (Next.js), plus the agent worker and text simulator (`agent` profile).
#
# REQUIRES LINUX: every service uses host networking. SIP/RTP and WebRTC need large UDP port ranges,
# which Docker's port mapping handles poorly, and Docker Desktop (macOS/Windows) host networking is its
# VM's, not your machine's.
#
# Run from the repo root and pass the root .env (paths below are relative to this deploy/ directory):
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d     (or: make up)
#
# Versions are pinned on purpose. Upgrade by bumping the tags in .env
# (LIVEKIT_VERSION / SIP_VERSION / EGRESS_VERSION) and testing on staging first.
#
# Project name: `dialtone`. Installs created before the rename (project `ai-calling`) keep their existing
# volumes (call history, Redis, recordings) by setting COMPOSE_PROJECT_NAME=ai-calling in .env.
name: dialtone

services:
  redis:
    image: redis:7.4-alpine
    network_mode: host
    restart: unless-stopped
    # Persist to disk: SIP trunks and dispatch rules live in Redis, so losing it
    # on a restart means every inbound call is rejected (486 no-dispatch).
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "${REDIS_PORT:-6380}",
              "--appendonly", "yes", "--appendfsync", "everysec", "--dir", "/data"]
    volumes:
      - redis-data:/data

  # Server database. Localhost only, data in the postgres-data volume.
  postgres:
    image: postgres:16.4-alpine
    network_mode: host
    restart: unless-stopped
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-dashboard}"
      POSTGRES_USER: "${POSTGRES_USER:-dashboard}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?run scripts/init.sh}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:${LIVEKIT_VERSION:?set LIVEKIT_VERSION in .env}
    network_mode: host
    restart: unless-stopped
    depends_on: [redis]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?run scripts/init.sh}: ${LIVEKIT_API_SECRET:?run scripts/init.sh}"
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: ["0.0.0.0"]
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          use_external_ip: true
        redis:
          address: 127.0.0.1:${REDIS_PORT:-6380}
        prometheus:
          port: 6789
        # Call events -> server (call history).
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://127.0.0.1:${DASHBOARD_PORT:-8787}/webhook
        logging:
          level: info
          json: true

  sip:
    image: livekit/sip:${SIP_VERSION:?set SIP_VERSION in .env}
    network_mode: host
    restart: unless-stopped
    depends_on: [redis, livekit]
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:${REDIS_PORT:-6380}
        sip_port: 5060
        rtp_port: 10000-20000
        use_external_ip: true
        prometheus_port: 6790
        logging:
          level: ${SIP_LOG_LEVEL:-info}

  # Call recording (LiveKit Egress). The agent starts an audio-only room composite per phone call; the
  # file lands in the dashboard-data volume (/data/recordings/YYYY/MM/<room>.ogg), which only the server
  # serves, to signed-in members. No SYS_ADMIN: that is only for enable_chrome_sandbox, which stays off.
  egress:
    image: livekit/egress:${EGRESS_VERSION:?set EGRESS_VERSION in .env}
    network_mode: host
    restart: unless-stopped
    depends_on: [redis, livekit]
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:${REDIS_PORT:-6380}
        health_port: 9091
        prometheus_port: 6791
        # One audio-only recording costs little; the default (1 CPU each) would refuse recordings on a busy
        # 2-vCPU VM. Refused or slow starts don't affect the call: it goes on unrecorded, without the notice.
        cpu_cost:
          audio_room_composite_cpu_cost: 0.25
          sdk_audio_room_composite_cpu_cost: 0.25
        logging:
          level: info
          json: true
    volumes:
      - dashboard-data:/data

  # Django server: calls dashboard, admin and the console's API. Listens on localhost only; open it via
  # `make tunnel`. (The volume keeps its old name, dashboard-data, so existing data is kept.)
  dialtone-server:
    build: ../server
    image: dialtone-server:local
    network_mode: host
    restart: unless-stopped
    depends_on:
      livekit:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file: ../.env
    environment:
      DASHBOARD_HOST: 127.0.0.1
    volumes:
      - dashboard-data:/data

  # Console (Next.js). Localhost only, like the server; open it via `make tunnel`.
  # Proxies /api/* to the server at DJANGO_URL, baked in at build time from DASHBOARD_PORT (default 8787).
  dialtone-console:
    build:
      context: ../console
      args:
        DJANGO_URL: "http://127.0.0.1:${DASHBOARD_PORT:-8787}"
    image: dialtone-console:local
    network_mode: host
    restart: unless-stopped
    depends_on: [dialtone-server]
    environment:
      PORT: "3000"
      HOSTNAME: 127.0.0.1

  # Agent worker. Runs on the media VM in phase 1; in phase 2 run only this
  # service on separate agent VMs with LIVEKIT_URL pointing at the media VM:
  #   make agent   (docker compose -f deploy/docker-compose.yml --env-file .env --profile agent up -d dialtone-agent)
  dialtone-agent:
    profiles: ["agent"]
    build: ../agent
    image: dialtone-agent:local
    network_mode: host
    restart: unless-stopped
    env_file: ../.env
    stop_grace_period: 5m  # let in-progress calls finish on deploy
    volumes:
      - agent-cache:/cache

  # Text simulator for the console's "Test chat" (agent/simulate.py). Same image as the
  # agent; listens on 127.0.0.1:${SIM_PORT:-8790} and only accepts the server's console-sim token.
  dialtone-agent-sim:
    profiles: ["agent"]
    build: ../agent
    image: dialtone-agent:local
    command: ["python", "simulate.py"]
    network_mode: host
    restart: unless-stopped
    env_file: ../.env

volumes:
  agent-cache:
  dashboard-data:
  postgres-data:
  redis-data:
