<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Carrum Voice - Sign in [Final · Light]</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            page: "#FBF9F5",
            panel: "#FFFFFF",
            borderSubtle: "#E4DFD6",
            rule: "#CFC8BC",
            well: "#F3F0EA",
            ink: "#1E1A16",
            secondaryInk: "#4A443D",
            mutedText: "#6E675F",
            amberBrand: "#F2B544",
            amberInk: "#2A1F0B",
            coolBlue: "#2F6DB5"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Hanken Grotesk", "sans-serif"],
            display: ["Hanken Grotesk", "sans-serif"],
            body: ["Hanken Grotesk", "sans-serif"],
            label: ["Hanken Grotesk", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        },
      },
    }
  </script>
</head>
<body class="bg-page text-ink font-body antialiased min-h-screen flex flex-col items-center justify-center p-6 selection:bg-[#FBEFD6] selection:text-[#9A6200]">
<!-- Centered Login Module -->
<main class="w-full max-w-[400px] flex flex-col items-center">
<!-- Sign-in Panel Card -->
<div class="w-full bg-panel border border-borderSubtle rounded-lg p-8 sm:p-10 shadow-none">
<!-- Brand & Heading Header -->
<div class="mb-8">
<div class="inline-flex items-center gap-2 mb-3">
<span class="font-headline text-lg font-medium text-ink tracking-tight">Carrum Voice</span>
<span class="w-1.5 h-1.5 rounded-full bg-coolBlue inline-block"></span>
</div>
<h1 class="font-headline text-2xl font-medium text-ink">Sign in</h1>
</div>
<!-- Continue with Google Action -->
<button class="w-full h-10 px-4 bg-panel border border-borderSubtle hover:bg-well rounded-lg text-ink font-body text-[15px] font-medium transition-colors duration-150 flex items-center justify-center gap-3 focus:outline-none focus:ring-1 focus:ring-rule active:scale-[0.99]" type="button">
<svg aria-hidden="true" class="w-4 h-4 shrink-0" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.17 0 10.03 0 12s.45 3.83 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span>Continue with Google</span>
</button>
<!-- Divider -->
<div class="relative my-6 flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-borderSubtle"></div>
</div>
<div class="relative bg-panel px-3 text-[13px] text-mutedText font-label">
          or
        </div>
</div>
<!-- Credentials Form -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Work Email Field -->
<div>
<label class="block text-[13px] font-medium text-secondaryInk mb-1.5 font-label" for="work-email">
            Work email
          </label>
<input autocomplete="email" class="w-full h-10 px-3.5 bg-well border border-borderSubtle rounded-lg text-ink text-[15px] placeholder-mutedText focus:bg-panel focus:border-coolBlue focus:ring-1 focus:ring-coolBlue transition-colors duration-150 outline-none" id="work-email" name="email" placeholder="name@company.com" type="email"/>
</div>
<!-- Password Field -->
<div>
<div class="flex items-center justify-between mb-1.5">
<label class="block text-[13px] font-medium text-secondaryInk font-label" for="password">
              Password
            </label>
<a class="text-[13px] text-mutedText hover:text-ink font-label transition-colors duration-150 underline-offset-2 hover:underline" href="#" tabindex="0">
              Forgot password?
            </a>
</div>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-10 pl-3.5 pr-10 bg-well border border-borderSubtle rounded-lg text-ink text-[15px] focus:bg-panel focus:border-coolBlue focus:ring-1 focus:ring-coolBlue transition-colors duration-150 outline-none" id="password" name="password" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-0 top-0 h-10 w-10 flex items-center justify-center text-mutedText hover:text-ink transition-colors duration-150 rounded-r-lg focus:outline-none" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[19px]" data-icon="visibility" id="password-icon">visibility</span>
</button>
</div>
</div>
<!-- Primary Amber Sign in Button -->
<div class="pt-2">
<button class="w-full h-10 bg-amberBrand hover:brightness-95 text-amberInk font-headline font-medium text-[15px] rounded-lg transition-all duration-150 flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-amberBrand focus:ring-offset-2 focus:ring-offset-panel active:scale-[0.99]" type="submit">
            Sign in
          </button>
</div>
</form>
</div>
<!-- Below Card Admin Note -->
<p class="mt-6 text-center text-[13px] text-mutedText font-label">
      No account? Ask your workspace admin for an invite.
    </p>
</main>
<!-- Interactive Scripts -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const togglePasswordBtn = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('password');
      const passwordIcon = document.getElementById('password-icon');

      if (togglePasswordBtn && passwordInput && passwordIcon) {
        togglePasswordBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          if (isPassword) {
            passwordInput.setAttribute('type', 'text');
            passwordIcon.textContent = 'visibility_off';
            passwordIcon.setAttribute('data-icon', 'visibility_off');
          } else {
            passwordInput.setAttribute('type', 'password');
            passwordIcon.textContent = 'visibility';
            passwordIcon.setAttribute('data-icon', 'visibility');
          }
        });
      }
    });
  </script>
</body></html>
