name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-check:
    name: scripts/ci-check.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Same Python as the agent and server images (python:3.12-slim).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            agent/requirements*.txt
            server/requirements*.txt

      # Same major as the console image (node:22-alpine).
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Python virtualenvs (agent/.venv, server/.venv)
        run: |
          python -m venv agent/.venv
          agent/.venv/bin/pip install -r agent/requirements-dev.txt
          python -m venv server/.venv
          server/.venv/bin/pip install -r server/requirements-dev.txt

      # The server tests expect PostgreSQL on 127.0.0.1:55432. `make test` starts it with `make test-db`
      # (a container named dialtone-test-pg) and skips that when the container is already running, so start
      # it here, where a failure shows up as its own step. A job `services:` container can't be used: it
      # would hold port 55432 under another name and `make test-db` would then fail to bind it.
      - name: Test database (postgres:16.4 on 127.0.0.1:55432)
        run: make test-db

      - name: scripts/ci-check.sh
        run: scripts/ci-check.sh
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Stop test database
        if: always()
        run: docker rm -f dialtone-test-pg || true
