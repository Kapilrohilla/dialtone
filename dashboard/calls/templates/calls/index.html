<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Calling</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #16181d; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --ok: #15803d; --ok-bg: #dcfce7; --warn: #b45309; --warn-bg: #fef3c7;
    --bad: #b91c1c; --bad-bg: #fee2e2; --chip: #f1f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --text: #e6e8ec; --muted: #9aa1ad; --line: #262a33;
      --accent: #60a5fa; --ok: #4ade80; --ok-bg: #12301f; --warn: #fbbf24; --warn-bg: #33270d;
      --bad: #f87171; --bad-bg: #3a1515; --chip: #222631;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; font-weight: 600; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .actions { display: inline-flex; align-items: center; gap: 16px; }
  .logout { margin: 0; }
  .logout button { background: none; border: 1px solid var(--line); border-radius: 6px; color: var(--muted);
                   font: inherit; font-size: 13px; padding: 3px 10px; cursor: pointer; }
  .logout button:hover { color: var(--text); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-bg); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 720px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .stat { padding: 14px 16px; }
  .stat .label { color: var(--muted); font-size: 12px; }
  .stat .value { font-size: 26px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .live { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .call { padding: 16px; }
  .call .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .call .num { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .call .timer { font-variant-numeric: tabular-nums; color: var(--muted); }
  .call .room { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-all; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  .badge { border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .setup { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 720px) { .setup { grid-template-columns: 1fr; } }
  .setup .panel { padding: 14px 16px; }
  .setup dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 13px; }
  .setup dt { color: var(--muted); }
  .setup dd { margin: 0; word-break: break-all; }
  .setup .item + .item { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
  .error { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>AI Calling</h1>
    <span class="actions">
      <span class="status"><span id="dot" class="dot"></span><span id="status">Connecting…</span></span>
      <form method="post" action="/admin/logout/" class="logout">{% csrf_token %}<button type="submit">Log out</button></form>
    </span>
  </header>

  <div id="error" class="error"></div>

  <section class="stats">
    <div class="stat"><div class="label">Live calls</div><div class="value" id="s-live">–</div></div>
    <div class="stat"><div class="label">Calls today (IST)</div><div class="value" id="s-today">–</div></div>
    <div class="stat"><div class="label">Answered by agent</div><div class="value" id="s-answered">–</div></div>
    <div class="stat"><div class="label">Avg duration</div><div class="value" id="s-avg">–</div></div>
  </section>

  <h2>Live calls</h2>
  <section id="live" class="live"></section>

  <h2>Recent calls</h2>
  <section class="panel table-wrap">
    <table>
      <thead><tr><th>Started</th><th>Caller</th><th>Number called</th><th>Duration</th><th>Agent</th><th>Ended</th></tr></thead>
      <tbody id="recent"></tbody>
    </table>
  </section>

  <h2>Setup</h2>
  <section class="setup">
    <div class="panel"><strong>Inbound trunks</strong><div id="trunks" style="margin-top:10px"></div></div>
    <div class="panel"><strong>Dispatch rules</strong><div id="rules" style="margin-top:10px"></div></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
let state = null;
let clockSkew = 0; // server time - browser time, so timers match the server

function fmtDur(sec) {
  if (sec == null || isNaN(sec)) return "–";
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}:${String(s).padStart(2, "0")}`;
}
function fmtTime(ts) {
  if (!ts) return "–";
  const d = new Date(ts * 1000);
  const today = new Date().toDateString() === d.toDateString();
  return today ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })
               : d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}
const nowSec = () => Date.now() / 1000 + clockSkew;

function statusBadge(status) {
  if (!status) return "";
  const cls = status === "active" ? "ok" : status === "hangup" ? "bad" : "warn";
  return `<span class="badge ${cls}">${esc(status)}</span>`;
}

function renderLive() {
  const live = state.live;
  $("s-live").textContent = live.length;
  if (!live.length) {
    const nums = state.trunks.flatMap((t) => t.numbers);
    $("live").innerHTML = `<div class="panel empty" style="grid-column:1/-1">No live calls.${nums.length ? ` Call <strong>${esc(nums.join(", "))}</strong> and it will show up here.` : ""}</div>`;
    return;
  }
  $("live").innerHTML = live.map((r) => {
    const sip = r.participants.find((p) => p.kind === "sip");
    const agent = r.participants.find((p) => p.kind === "agent");
    const others = r.participants.filter((p) => p !== sip && p !== agent);
    const since = sip?.joined_at || r.created_at;
    return `<div class="panel call">
      <div class="top">
        <span class="num">${esc(sip?.phone || "Unknown caller")}</span>
        <span class="timer" data-since="${since}">${fmtDur(nowSec() - since)}</span>
      </div>
      <div class="room">${esc(r.room)}</div>
      <div class="chips">
        ${sip ? `<span class="chip">Caller</span>${statusBadge(sip.call_status)}` : `<span class="badge warn">no caller</span>`}
        ${agent ? `<span class="badge ok">Agent joined</span>` : `<span class="badge warn">Waiting for agent</span>`}
        ${others.map((p) => `<span class="chip">${esc(p.kind)}: ${esc(p.identity)}</span>`).join("")}
      </div>
    </div>`;
  }).join("");
}

function renderRecent() {
  const rows = state.recent;
  if (!rows.length) {
    $("recent").innerHTML = `<tr><td colspan="6" class="empty">No calls yet.</td></tr>`;
    return;
  }
  $("recent").innerHTML = rows.map((c) => {
    const start = c.answered_at || c.started_at;
    const dur = c.ended_at && start ? c.ended_at - start : null;
    const ongoing = !c.ended_at;
    return `<tr>
      <td class="num">${fmtTime(c.started_at)}</td>
      <td class="num">${esc(c.caller) || '<span class="muted">–</span>'}</td>
      <td class="num">${esc(c.called) || '<span class="muted">–</span>'}</td>
      <td class="num">${ongoing ? '<span class="badge ok">live</span>' : fmtDur(dur)}</td>
      <td>${c.agent_joined_at ? '<span class="badge ok">yes</span>' : '<span class="badge bad">no</span>'}</td>
      <td class="muted">${ongoing ? "" : esc((c.end_reason || "").replace(/_/g, " "))}</td>
    </tr>`;
  }).join("");
}

function renderStats() {
  const t = state.today || {};
  $("s-today").textContent = t.total ?? 0;
  $("s-answered").textContent = t.total ? `${Math.round((100 * (t.answered || 0)) / t.total)}%` : "–";
  $("s-avg").textContent = fmtDur(t.avg_duration);
}

function renderSetup() {
  $("trunks").innerHTML = state.trunks.length ? state.trunks.map((t) => `<div class="item"><dl>
      <dt>Name</dt><dd>${esc(t.name)}</dd><dt>ID</dt><dd>${esc(t.id)}</dd>
      <dt>Numbers</dt><dd>${esc(t.numbers.join(", "))}</dd>
      <dt>Allowed IPs</dt><dd>${esc(t.allowed.join(", "))}</dd></dl></div>`).join("")
    : `<div class="muted">No inbound trunk. Run <code>make sip</code>.</div>`;
  $("rules").innerHTML = state.rules.length ? state.rules.map((r) => `<div class="item"><dl>
      <dt>Name</dt><dd>${esc(r.name)}</dd><dt>ID</dt><dd>${esc(r.id)}</dd>
      <dt>Trunks</dt><dd>${esc(r.trunks.join(", ") || "all")}</dd>
      <dt>Agent</dt><dd>${esc(r.agents.join(", ") || "–")}</dd></dl></div>`).join("")
    : `<div class="muted">No dispatch rule.</div>`;
}

async function refresh() {
  try {
    const res = await fetch("api/state", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    state = await res.json();
    clockSkew = state.now - Date.now() / 1000;
    const ok = state.server.ok;
    $("dot").className = `dot ${ok ? "ok" : "bad"}`;
    $("status").textContent = ok ? `LiveKit connected · updated ${new Date().toLocaleTimeString()}` : "LiveKit unreachable";
    $("error").style.display = ok ? "none" : "block";
    $("error").textContent = ok ? "" : `LiveKit API error: ${state.server.error}`;
    renderLive(); renderRecent(); renderStats(); renderSetup();
  } catch (e) {
    $("dot").className = "dot bad";
    $("status").textContent = "Dashboard unreachable";
  }
}

// Tick live timers every second between 2s refreshes.
setInterval(() => document.querySelectorAll("[data-since]").forEach((el) => {
  el.textContent = fmtDur(nowSec() - Number(el.dataset.since));
}), 1000);
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
